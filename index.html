<!DOCTYPE html>
<html lang="it-IT">
<head>
<meta charset="UTF-8">
<title>Sito in costruzione</title>
<meta name="viewport" content="width=device-width, maximum-scale=1, initial-scale=1, minimum-scale=1">
<meta name="description" content="Site will be available soon. Thank you for your patience!">
<meta property="og:site_name" content="EMMAGOLD - Site will be available soon. Thank you for your patience!">
<meta property="og:title" content="Sito in costruzione">
<meta property="og:type" content="website">
<meta property="og:description" content="Site will be available soon. Thank you for your patience!">
<link rel="icon" href="assets/emma-gold-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111111;
    --fg: #ffffff;
    --link: #57BAFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  a { color: var(--link); }
  a:hover { color: var(--link); }

  .mtnc-background-image {
    background-image: url("assets/background.jpg");
    background-size: cover;
    background-position: center center;
    width: 110%;
    height: 110%;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    margin: -5%;
    filter: blur(5px);
    opacity: 0.55;
    z-index: 0;
  }

  .main-container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 120px;
    text-align: center;
  }

  .logo-wrap {
    margin: 5px auto;
    padding: 10px 0;
    max-width: 600px;
  }

  .logo-wrap img {
    width: 350px;
    max-width: 80vw;
    height: auto;
  }

  .site-title {
    margin: 80px auto 5px;
    padding: 10px 0;
    max-width: 600px;
  }

  .site-title h2 {
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 300;
    font-size: 45px;
    line-height: 1em;
    text-align: center;
    margin: 0;
    letter-spacing: 1px;
  }

  .site-content {
    margin: 5px auto 80px;
    padding: 10px 0;
    max-width: 600px;
  }

  .site-content p {
    font-size: 16px;
    line-height: 1.4em;
    margin: 0;
  }

  .site-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    padding: 10px 20px;
    text-align: center;
    background: linear-gradient(to top, rgba(17,17,17,0.85), rgba(17,17,17,0));
  }

  .site-footer p {
    font-size: 14px;
    line-height: 1.4em;
    margin: 0;
  }

  @media (max-width: 600px) {
    .site-title h2 { font-size: 30px; }
    .site-title { margin-top: 50px; }
    .site-footer p { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="mtnc-background-image" aria-hidden="true"></div>

<div class="main-container">

  <div class="logo-wrap">
    <img src="assets/emma-gold-logo.png" alt="EMMA GOLD - made in Italy">
  </div>

  <div class="site-title">
    <h2><span>SITO IN COSTRUZIONE</span></h2>
  </div>

  <div class="site-content">
    <p><span>Site will be available soon. Thank you for your patience!</span></p>
  </div>

</div>

<footer class="site-footer">
  <p><span>&copy; EMMAGOLD <span id="current-year">2025</span> Desir&egrave; S.r.l. - Piazza A. Volta, 24/25 - 52041 Civitella in Val di Chiana (AR) - Phone +39 0575 295584 <a href="mailto:info@desiregioielli.com">info@desiregioielli.com</a> - Copyright <a href="https://www.colorservice.it" target="_blank" rel="noopener">COLOR SERVICE</a></span></p>
</footer>

<script>
  document.getElementById('current-year').textContent = new Date().getFullYear();
</script>

</body>
</html>
